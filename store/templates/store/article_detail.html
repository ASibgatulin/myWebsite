{% extends 'store/base.html' %}
{% block title %}{{ article.title }}{% endblock %}

{% block content %}
<article>
    <h1>{{ article.title }}</h1>
    <p class="date">Опубликовано: {{ article.created_at|date:"d.m.Y" }}</p>
    {% if article.image %}
        <img src="{{ article.image.url }}" alt="{{ article.title }}" class="article-img">
    {% endif %}
    <div class="article-content">
        {{ article.content|safe }}
    </div>
    <p><a href="{% url 'articles' %}">← Назад ко всем статьям</a></p>
</article>
{% endblock %}
